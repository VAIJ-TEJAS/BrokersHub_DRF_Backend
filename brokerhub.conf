server {
    listen 80;
    server_name 0.0.0.0;  

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name 0.0.0.0; 

    ssl_certificate /home/ec2-user/workspace/BrokersHub_DRF_Backend/certificate.crt;
    ssl_certificate_key /home/ec2-user/workspace/BrokersHub_DRF_Backend/private.key;

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ec2-user/workspace/BrokersHub_DRF_Backend/static/;
    }

    location /media/ {
        alias /home/ec2-user/workspace/BrokersHub_DRF_Backend/media/;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
